services:
  postgres:
    image: postgres:16-alpine
    container_name: cbt_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cbtdb}
      POSTGRES_USER: ${POSTGRES_USER:-cbt_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cbt_password_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cbt_admin} -d ${POSTGRES_DB:-cbtdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cbt_mailhog
    restart: always
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cbt_backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cbtdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cbt_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cbt_password_secret}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailhog}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-zK9xM2vR7pL5wQ8yU3tZ1aB4cD6eF8gH0jK2mN4pQ6rS8tU1vW3xY5zA7bC9dE1fG}
      APP_SNAPSHOT_STORAGE_DIR: ${APP_SNAPSHOT_STORAGE_DIR:-/app/snapshots}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
    volumes:
      - ./snapshots:/app/snapshots
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cbt_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: cbt_nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
