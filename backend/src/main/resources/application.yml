server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: cbt-exam-platform-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cbtdb}
    username: ${SPRING_DATASOURCE_USERNAME:cbt_admin}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    repair-on-migrate: true
    out-of-order: false
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*,https://*.netlify.app,http://localhost:3000,http://localhost:80,http://localhost,http://127.0.0.1:3000}
  jwt:
    secret: ${APP_JWT_SECRET:zK9xM2vR7pL5wQ8yU3tZ1aB4cD6eF8gH0jK2mN4pQ6rS8tU1vW3xY5zA7bC9dE1fG}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
  admin:
    chat-id: ${TELEGRAM_ADMIN_CHAT_ID:}
